<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirti’s Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="column">
    <header class="nav">
      <nav class="nav__links" aria-label="Primary">
        <a class="nav__item nav__item--active" href="#home">Home<img class="nav__underline" src="assets/line2.svg" alt=""></a>
        <a class="nav__item" href="#work">Work</a>
        <a class="nav__item" href="#about">About</a>
        <a class="nav__item nav__item--more" href="#resume">Resume <img src="assets/arrow.svg" width="14" height="14" alt=""></a>
        <button class="nav__theme" type="button" aria-label="Toggle theme"><img src="assets/theme-sun.svg" width="18" height="18" alt=""></button>
      </nav>
    </header>

    <section class="hero" id="home">
      <img class="hero__ellipse" src="assets/ellipse1.svg" width="201" height="134" alt="">
      <h1 class="hero__title hero__title--a">Welcome to</h1>
      <h1 class="hero__title hero__title--b">Kirti’s portfolio</h1>
      <img class="hero__photo" src="assets/image5.png" alt="Portrait of Kirti holding a coffee cup">
      <div class="hero__arrow hero__arrow--a"><div class="hero__arrow-inner"><img src="assets/vector.svg" alt=""></div></div>
      <div class="hero__arrow hero__arrow--b"><div class="hero__arrow-inner"><img src="assets/vector1.svg" alt=""></div></div>
      <p class="hand hand--left">prev a summer intern @ Accenture Song</p>
      <p class="hand hand--right">I connect what people need with what a business is striving to achieve, then ideate, sketch and build ideas that bring the two together.</p>
    </section>

    <section class="projects" id="work">
      <div class="projects__header"><h2>Selected Projects</h2></div>
      <div class="projects__grid" data-image="assets/image39.png"></div>
    </section>

    <section class="projects" id="about">
      <div class="projects__header"><h2>About my process</h2></div>
      <div class="projects__grid projects__grid--single" data-image="assets/image41.png" data-count="1"></div>
    </section>
  </div>

  <template id="card">
    <article class="card">
      <img class="card__image" alt="">
      <div class="card__title-row">
        <div class="card__titles">
          <p class="card__name">Timmo</p>
          <p class="card__tagline">Timmer with leaderboard and analytics.</p>
        </div>
        <div class="card__live"><img src="assets/dot.svg" width="6" height="6" alt=""><span>Live</span></div>
      </div>
      <p class="card__desc">A clean productivity app for tracking time and staying consistent. Focus, manage tasks, and visualize your progress with insightful stats.</p>
      <div class="card__footer">
        <ul class="card__tags"><li>React</li><li>Tailwind CSS</li><li>Shadcn UI</li></ul>
        <div class="card__links">
          <a href="#" aria-label="Live site"><img src="assets/web.svg" width="20" height="20" alt=""></a>
          <a href="#" aria-label="GitHub repository"><img src="assets/github.svg" width="20" height="20" alt=""></a>
        </div>
      </div>
    </article>
  </template>

  <script>
    const tpl = document.getElementById('card');
    document.querySelectorAll('.projects__grid').forEach(grid => {
      const n = Number(grid.dataset.count || 4);
      for (let i = 0; i < n; i++) {
        const el = tpl.content.cloneNode(true);
        el.querySelector('.card__image').src = grid.dataset.image;
        grid.appendChild(el);
      }
    });
  </script>
</body>
</html>
