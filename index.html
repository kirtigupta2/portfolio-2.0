<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirti’s Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <nav class="nav__links" aria-label="Primary">
        <a class="nav__item nav__item--tab nav__item--active" href="#home" aria-current="page">Home<img class="nav__underline" src="assets/line2.svg" alt=""></a>
        <a class="nav__item nav__item--tab" href="#work">Work<img class="nav__underline" src="assets/line2.svg" alt=""></a>
        <a class="nav__item nav__item--tab" href="about.html">About<img class="nav__underline" src="assets/line2.svg" alt=""></a>
        <a class="nav__item nav__item--more" href="#resume">Resume <img src="assets/arrow.svg" width="18" height="18" alt=""></a>
        <button class="nav__theme" type="button" aria-label="Toggle theme"><img src="assets/theme-sun.svg" width="20" height="20" alt=""></button>
      </nav>
    </div>
  </header>
  <div class="column">
    <section class="hero" id="home">
      <img class="hero__ellipse" src="assets/ellipse1.svg" width="201" height="134" alt="">
      <h1 class="hero__title hero__title--a">Welcome to</h1>
      <h1 class="hero__title hero__title--b">Kirti’s portfolio</h1>
      <img class="hero__photo" src="assets/image5.png" alt="Portrait of Kirti holding a coffee cup">
      <div class="hero__arrow hero__arrow--a"><div class="hero__arrow-inner"><img src="assets/vector.svg" alt=""></div></div>
      <div class="hero__arrow hero__arrow--b"><div class="hero__arrow-inner"><img src="assets/vector1.svg" alt=""></div></div>
      <p class="hand hand--left">prev a summer intern @</p>
      <p class="hand-group"><span class="hand-text">Accenture Song</span><img src="assets/accenture-logo.png" width="17" height="17" alt="Accenture logo"></p>
      <p class="hand hand--right">I connect what <span class="mark">people need with what a business is striving to achieve, then ideate, sketch and build ideas</span> that bring the two together.</p>
    </section>

    <section class="projects projects--work" id="work">
      <div class="projects__header projects__header--work">
        <h2>Featured Projects</h2>
        <div class="header-icon" aria-hidden="true">
          <canvas id="box-canvas" width="300" height="252"></canvas>
        </div>
      </div>
      <div class="projects__body">
        <div class="projects__grid" id="work-grid"></div>
      </div>
    </section>

    <section class="projects" id="about">
      <div class="projects__header"><h2>About my process</h2></div>
      <div class="about-board">
        <div class="about-board__card"><img src="assets/about-notebook.png" alt="Open notebook showing education, certifications, skills and interests"></div>
      </div>
    </section>
  </div>

  <template id="card">
    <article class="card">
      <div class="card__media"><img class="card__image" alt=""></div>
      <div class="card__title-row">
        <div class="card__titles">
          <p class="card__name"></p>
          <p class="card__tagline"></p>
        </div>
        <div class="card__live"><img class="card__dot" width="6" height="6" alt=""><span class="card__status"></span></div>
      </div>
      <p class="card__desc"></p>
      <div class="card__footer">
        <ul class="card__tags"></ul>
        <div class="card__links">
          <a href="#" aria-label="Live site"><img src="assets/web.svg" width="20" height="20" alt=""></a>
          <a href="#" aria-label="GitHub repository"><img src="assets/github.svg" width="20" height="20" alt=""></a>
        </div>
      </div>
    </article>
  </template>

  <!-- Rough-edge filter gives the marker stroke its hand-drawn, slightly torn edges -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="marker-rough" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.35" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <script>
    // ---- Highlighter marker: sweeps over the .mark phrase, one stroke per rendered line ----
    (function () {
      const mark = document.querySelector('.mark');
      const host = mark.closest('p');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      // Tuning knobs
      const START_DELAY = 900;   // ms after the page is ready
      const SPEED = 0.75;        // px per ms the marker travels
      const MIN_MS = 450, GAP_MS = 120;   // min stroke time / pause when "moving" to the next line
      const EASE = 'cubic-bezier(.5,.05,.3,1)';

      let layer = host.querySelector('.marker-layer');
      let animated = false;

      function build() {
        if (layer) layer.remove();
        layer = document.createElement('span');
        layer.className = 'marker-layer';
        host.prepend(layer);
        const hb = host.getBoundingClientRect();
        const rects = [...mark.getClientRects()].filter(r => r.width > 2);
        let t = START_DELAY;
        rects.forEach((r, i) => {
          const wrap = document.createElement('span');
          wrap.className = 'marker-stroke';
          // slight overshoot past the text and a touch taller than the line, like a real marker pass
          const padX = 5, padY = 3;
          Object.assign(wrap.style, {
            left: (r.left - hb.left - padX) + 'px',
            top: (r.top - hb.top - padY + (i % 2 ? 1 : -1)) + 'px',
            width: (r.width + padX * 2) + 'px',
            height: (r.height + padY * 2) + 'px',
            '--tilt': ((i % 2 ? 0.5 : -0.4) + (i * 0.15)) + 'deg',
            '--shape': 'var(--shape-' + (i % 3) + ')',
          });
          layer.append(wrap);
          const dur = Math.max(MIN_MS, r.width / SPEED);
          if (reduce || animated) {
            wrap.style.clipPath = 'inset(0)';
          } else {
            wrap.animate(
              [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }],
              { duration: dur, delay: t, easing: EASE, fill: 'both' }
            );
            t += dur + GAP_MS;
          }
        });
      }

      // Build after fonts load so line breaks are final, then replay only once.
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
        build();
        animated = true;
        let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
      });
    })();


    // Nav: Home / Work swap on click (scrolling manually never changes the tab, except back at the very top).
    // About is a separate page, so it is a normal link.
    const tabs = [...document.querySelectorAll('.nav__item--tab[href^="#"]')];
    function setActive(hash) {
      const target = tabs.find(t => t.getAttribute('href') === hash) || tabs[0];
      tabs.forEach(t => {
        const on = t === target;
        t.classList.toggle('nav__item--active', on);
        on ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current');
      });
    }
    tabs.forEach(t => t.addEventListener('click', () => setActive(t.getAttribute('href'))));
    addEventListener('scroll', () => { if (scrollY < 10) setActive('#home'); }, { passive: true });
    setActive(tabs.some(t => t.getAttribute('href') === location.hash) ? location.hash : '#home');

    // Project cards (content from the Figma file)
    const TAGLINE = 'Operations dashboard for a modular sneaker brand';
    const DESC = 'Three brand specific metrics help a solo operator gauge demand for customization and see how many complete bundles are ready to ship.';
    const TAGS = ['Data Visualization', 'Dashboard Design', 'E- commerce'];
    const PROJECTS = [
      { name: 'Svaroots',  image: 'assets/project-svaroots.png',  height: 377, status: 'Live', box: 1, tab: 'assets/svaroots-tab.png' },  // tab: red card that rises on hover
      { name: 'Vitta',     image: 'assets/project-vitta.png',     height: 378, status: 'Live', box: 2 },
      { name: 'Breezy',    image: 'assets/project-breezy.png',    height: 416, status: 'Live', box: 3 },
      { name: 'PromptKit', image: 'assets/project-promptkit.png', height: 416, status: 'Coming Soon', box: 0 },  // no box image 4 in Figma yet
    ];
    const tpl = document.getElementById('card');
    const grid = document.getElementById('work-grid');
    // Header box: shows the folder of the hovered/focused card "coming out" of the box (box-0 = nothing hovered).
    // One canvas blends all four box images by weight. Weights glide toward the hovered image and always sum to 1,
    // drawn additively ("lighter"), so every frame is a true mix of the images: no layer is ever added or removed,
    // nothing pops, and moving to another card mid-glide just changes the target smoothly.
    const BOX_SRC = [0, 1, 2, 3].map(n => 'assets/box-' + n + '.png');
    const boxCanvas = document.getElementById('box-canvas');
    const bctx = boxCanvas.getContext('2d');
    bctx.imageSmoothingQuality = 'high';
    const boxImgs = BOX_SRC.map(s => { const im = new Image(); im.onload = () => drawBox(); im.src = s; return im; });
    const OMEGA = 17;                                 // spring stiffness: higher = faster (about 0.35s to settle)
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let weights = [1, 0, 0, 0], vel = [0, 0, 0, 0], goal = 0, raf = 0, last = 0;
    function drawBox() {
      bctx.globalCompositeOperation = 'source-over';
      bctx.clearRect(0, 0, boxCanvas.width, boxCanvas.height);
      bctx.globalCompositeOperation = 'lighter';
      boxImgs.forEach((im, i) => {
        if (weights[i] > 0.001 && im.complete && im.naturalWidth) {
          bctx.globalAlpha = Math.min(1, weights[i]);
          bctx.drawImage(im, 0, 0, boxCanvas.width, boxCanvas.height);
        }
      });
      bctx.globalAlpha = 1;
    }
    function tickBox(now) {
      // Critically damped spring per weight: eases in and out, keeps its momentum if the target changes mid-move,
      // and (being linear) keeps the weights summing to 1.
      let remaining = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
      while (remaining > 0) {
        const h = Math.min(0.004, remaining); remaining -= h;
        for (let i = 0; i < 4; i++) {
          const g = i === goal ? 1 : 0;
          vel[i] += (OMEGA * OMEGA * (g - weights[i]) - 2 * OMEGA * vel[i]) * h;
          weights[i] += vel[i] * h;
        }
      }
      const settled = weights.every((w, i) => Math.abs((i === goal ? 1 : 0) - w) < 0.003 && Math.abs(vel[i]) < 0.03);
      if (settled) { weights = weights.map((_, i) => (i === goal ? 1 : 0)); vel = [0, 0, 0, 0]; }
      drawBox();
      raf = settled ? 0 : requestAnimationFrame(tickBox);
    }
    function showBox(n) {
      goal = n;
      if (reduceMotion) { weights = weights.map((_, i) => (i === n ? 1 : 0)); vel = [0, 0, 0, 0]; drawBox(); return; }
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tickBox); }
    }
    grid.addEventListener('mouseleave', () => showBox(0));
    grid.addEventListener('focusout', () => showBox(0));
    PROJECTS.forEach(p => {
      const el = tpl.content.cloneNode(true);
      const card = el.querySelector('.card');
      card.tabIndex = 0;
      card.addEventListener('mouseenter', () => showBox(p.box));
      card.addEventListener('focus', () => showBox(p.box));
      const img = el.querySelector('.card__image'); img.src = p.image; img.alt = p.name + ' project preview'; img.style.height = p.height + 'px';
      if (p.tab) {
        // Only the red tab moves: it rises ~10px over the (static) folder image and shows live text
        const tab = document.createElement('div');
        tab.className = 'card__tab'; tab.setAttribute('aria-hidden', 'true');
        tab.innerHTML = '<div class="card__tab-inner"><img src="' + p.tab + '" alt=""><span>Click to read on Behance</span></div>';
        img.parentElement.append(tab);
      }
      el.querySelector('.card__name').textContent = p.name;
      el.querySelector('.card__tagline').textContent = TAGLINE;
      el.querySelector('.card__dot').src = p.status === 'Live' ? 'assets/dot.svg' : 'assets/dot-soon.svg';
      el.querySelector('.card__status').textContent = p.status;
      el.querySelector('.card__desc').textContent = DESC;
      TAGS.forEach(t => { const li = document.createElement('li'); li.textContent = t; el.querySelector('.card__tags').append(li); });
      grid.append(el);
    });
  </script>
</body>
</html>
