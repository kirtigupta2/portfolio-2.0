<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Process · Kirti’s Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .soon { position: relative; min-height: calc(100vh - 80px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 24px 80px; }
    .soon h1 { font-size: clamp(32px, 11.5vw, 67.112px); line-height: normal; color: var(--text); }
    .soon p { font-family: 'Figma Hand', 'Segoe Print', 'Comic Sans MS', cursive; font-size: 20.973px; line-height: 29.362px; color: var(--note); }
    @media (max-width: 1180px) { .nav__inner { padding: 0 12px; } .nav__links { gap: 14px; } .nav__item { font-size: 15px; } .nav__item img { width: 14px; height: 14px; } }
    .soon a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <nav class="nav__links" aria-label="Primary">
        <span class="nav__circle" id="nav-circle" aria-hidden="true"></span>
        <a class="nav__item nav__item--tab" href="index.html#home">Home</a>
        <a class="nav__item nav__item--tab" href="index.html#work">Work</a>
        <a class="nav__item nav__item--tab nav__item--active" href="about.html" aria-current="page">Process</a>
        <a class="nav__item nav__item--more" href="#resume">Resume <img src="assets/arrow.svg" width="18" height="18" alt=""></a>
        <button hidden class="nav__theme" type="button" aria-label="Theme switch (coming soon)" disabled><img src="assets/theme-sun.svg" width="20" height="20" alt=""></button>
      </nav>
    </div>
  </header>
  <div class="column">
    <main class="soon">
      <h1>Coming soon</h1>
      <p>This page is still being drawn. <a href="index.html">Back to home</a></p>
    </main>
  </div>
  <script>
    // The circle sits on the current page's nav item (About) and draws itself on load
    const circle = document.getElementById('nav-circle'), links = circle.parentElement;
    const item = document.querySelector('.nav__item--active');
    function place() {
      const lr = links.getBoundingClientRect(), r = item.getBoundingClientRect();
      Object.assign(circle.style, { left: (r.left - lr.left - 17) + 'px', top: (r.top - lr.top - 12) + 'px', width: (r.width + 34) + 'px', height: (r.height + 26) + 'px', opacity: 1 });
    }
    place(); addEventListener('resize', place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && circle.animate) {
      circle.animate([{ '--p': '0deg' }, { '--p': '372deg' }], { duration: 650, delay: 150, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'both' });
    }
  </script>
</body>
</html>
